[package]
name = "contribcard"
description = "ContribCard CLI tool"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/cncf/contribcard"
readme = "README.md"
authors = ["Sergio Castaño Arteaga", "Cintia Sanchez Garcia"]

[dependencies]
anyhow = "1.0.104"
askama = { version = "0.16.1", features = ["serde_json"] }
aws-config = "1.13.0"
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
deadpool = "0.13.1"
dirs = "7.0.0"
duckdb = { version = "1.20000.1", features = ["json"] }
futures = "0.3.34"
md-5 = "0.11.0"
mime_guess = "2.0.5"
parse_link_header = "0.4.1"
reqwest = { version = "0.13.5", features = ["json"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[build-dependencies]
anyhow = "1.0.104"
which = "8.0.6"
